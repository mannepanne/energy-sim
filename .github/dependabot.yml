# ABOUT: Dependabot keeps the GitHub Actions pins and the npm dependencies current
# ABOUT: Weekly grouped pull requests, each reviewed like any other change

# Every version update waits until the release is 14 days old. Most hijacked or broken releases are
# caught and pulled within days, so the wait lets others find problems first. Security updates
# (switched on in the repository settings) are not delayed: GitHub's cooldown applies to version
# updates only. See REFERENCE/decisions/2026-10-18-fourteen-day-dependency-wait.md.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      # oxlint-tsgolint is built against one TypeScript version, so the two move together.
      # See REFERENCE/decisions/2026-10-17-typescript-7-with-oxlint.md.
      typescript:
        patterns: [typescript, oxlint-tsgolint]
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns: [typescript, oxlint-tsgolint]
