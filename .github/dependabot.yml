# ABOUT: Dependabot keeps the GitHub Actions pins and npm dev dependencies current
# ABOUT: Weekly grouped pull requests, each reviewed like any other change

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # oxlint-tsgolint is built against one TypeScript version, so the two move together.
      # See REFERENCE/decisions/2026-10-17-typescript-7-with-oxlint.md.
      typescript:
        patterns: [typescript, oxlint-tsgolint]
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns: [typescript, oxlint-tsgolint]
