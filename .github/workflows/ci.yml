# ABOUT: Continuous integration for every pull request and every push to main
# ABOUT: Runs type checking, lint, tests with coverage, the site build and payload check, the report drift check and the bench on the Node LTS in .nvmrc

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Site build
        run: npm run site:build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # The home page's first load, gzipped: scripts, the worker and the data. Fails above 350 KB.
      - name: Site payload
        run: npm run site:payload

      # Regenerates the phase 2 report offline and fails if it differs from the committed copy,
      # including a report that was never committed. The phase 1 report is historical and not regenerated.
      - name: Report drift
        run: |
          npm run report
          git diff --exit-code reports/
          if [ -n "$(git status --porcelain reports/)" ]; then
            git status --porcelain reports/
            echo "reports/ has uncommitted files: run npm run report and commit the result"
            exit 1
          fi

      # Outside the coverage run: one central run of the 10 combinations (100 ms), 500 samples of 2 setups (5 s),
      # 4 setups and all 10 (10 s each), and the full phase 2 report (60 s). Fails above any limit.
      - name: Bench
        run: npm run bench
