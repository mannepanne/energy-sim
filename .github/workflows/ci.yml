# ABOUT: Continuous integration for every pull request and every push to main
# ABOUT: Runs type checking, lint and tests with coverage thresholds on the Node LTS in .nvmrc

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      # Added in the phase 1 ranges-and-report PR (see SPECIFICATIONS/01-engine-core.md):
      # - name: Report drift
      #   run: npm run report && git diff --exit-code reports/
      # - name: Bench
      #   run: npm run bench
