# ABOUT: Builds the static site and deploys it to Cloudflare Workers: PRs to the staging Worker, main to the beta
# ABOUT: Switched off until the repository variable CLOUDFLARE_DEPLOY is "true" and the two Cloudflare secrets exist

name: Deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'push' && 'beta' || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the site
    # Pull requests from forks get no secrets, so only branches in this repository deploy.
    if: vars.CLOUDFLARE_DEPLOY == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: 1
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Site build
        run: npm run site:build

      - name: Deploy to staging
        if: github.event_name == 'pull_request'
        run: npm run deploy:staging -w site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy the beta
        if: github.event_name == 'push'
        run: npm run deploy -w site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
